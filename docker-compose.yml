services:
  mongodb:
    image: mongo:7-jammy
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5001
      MONGODB_URL: mongodb://mongodb:27017/asiabazzar
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      mongodb: { condition: service_healthy }
    ports: ["5001:5001"]
  web:
    build:
      context: ./client
      args: { VITE_API_URL: "http://localhost:5001" }
    restart: unless-stopped
    depends_on: [api]
    ports: ["8080:8080"]
volumes:
  mongo-data:
