<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C8102E"/>
      <stop offset="100%" style="stop-color:#8B0000"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FFA500"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>

  <!-- Decorative outer ring -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.6"/>

  <!-- Stylized "AB" monogram -->
  <!-- A -->
  <text x="10" y="44" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="url(#gold)" letter-spacing="-1">AB</text>

  <!-- Bottom decorative line -->
  <line x1="10" y1="50" x2="54" y2="50" stroke="url(#gold)" stroke-width="1.5" opacity="0.7"/>

  <!-- Small star accents -->
  <polygon points="32,6 33.2,9.6 37,9.6 34,11.8 35.2,15.4 32,13.2 28.8,15.4 30,11.8 27,9.6 30.8,9.6" fill="#FFD700" opacity="0.9"/>
</svg>
