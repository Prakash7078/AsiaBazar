name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: { component: [client, server] }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.component }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.component }}
      - run: npm run lint
        working-directory: ${{ matrix.component }}
      - if: matrix.component == 'server'
        run: npm test
        working-directory: server
      - if: matrix.component == 'client'
        run: npm run build
        working-directory: client
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag asia-bazzar-client:test client
      - run: docker build --tag asia-bazzar-server:test server
